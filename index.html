<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boosted · Pannello demo</title>
<link rel="icon" href="boosted_icon.png">
<!-- ANTEPRIMA DEL LINK. Questo indirizzo si manda ai clienti, spesso su WhatsApp:
     finora arrivava come URL nudo. Con questi dati arriva con titolo, descrizione e
     logo. Nessuna promessa in piu' di quelle che le demo mantengono davvero. -->
<meta name="description" content="Le demo dei sistemi Boosted: ordini al tavolo col QR, ecommerce, salone e assistente al telefono. Si provano dal vivo, dal browser.">
<meta name="theme-color" content="#08090A">
<meta property="og:type" content="website">
<meta property="og:locale" content="it_IT">
<meta property="og:site_name" content="Boosted Company">
<meta property="og:title" content="Boosted · Pannello demo">
<meta property="og:description" content="Ordini al tavolo col QR, ecommerce, salone e assistente al telefono. Si provano dal vivo, dal browser.">
<meta property="og:url" content="https://worksimbeta-maker.github.io/boosted-demo/">

<style>
/* Inter self-hosted — nessuna richiesta a Google Fonts (privacy). Variabile 100–900, latino + esteso. */
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latinext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
</style>
<style>
:root{--black:#08090A;--bar:#0d0e12;--surface:#121319;--surface2:#171922;--border:rgba(201,169,233,.16);
--soft:rgba(255,255,255,.07);--lilac:#C9A9E9;--purple:#8B6FB8;--white:#F7F8F8;--gray:#8A8F98;
--grad:linear-gradient(150deg,#C9A9E9,#8B6FB8);--green:#40c878}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:var(--black);color:var(--white);
display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow:hidden}

/* header */
.bar{display:flex;align-items:center;gap:12px;padding:11px 18px;background:var(--bar);border-bottom:1px solid var(--soft);flex:none}
.logo{height:30px;width:auto;display:block}
.bar .w{display:flex;flex-direction:column;line-height:1}
.bar .w b{font-size:14px;font-weight:800;letter-spacing:.16em}
.bar .w span{font-size:7.5px;font-weight:600;letter-spacing:.4em;color:var(--gray);margin-top:3px}
.bar .sp{flex:1}
.bar .hint{font-size:11px;color:var(--gray);letter-spacing:.04em}

/* service tabs */
.tabs{display:flex;gap:6px;padding:10px 14px 0;background:var(--bar);flex:none}
.tab{position:relative;display:flex;align-items:center;gap:9px;font-family:inherit;font-size:14px;font-weight:600;
color:var(--gray);background:transparent;border:1px solid transparent;border-bottom:none;padding:11px 18px;border-radius:11px 11px 0 0;
cursor:pointer;transition:.15s}
.tab:hover{color:var(--white)}
.tab.on{color:var(--white);background:linear-gradient(180deg,rgba(201,169,233,.12),var(--black) 60%);border-color:var(--border);box-shadow:inset 0 2px 0 0 var(--lilac)}
.tab .led{width:8px;height:8px;border-radius:50%;background:var(--gray);transition:.2s;flex:none}
/* Il verde significa "ha risposto davvero", non "l'indirizzo e' scritto nel codice". */
.tab.s-pronto  .led{background:var(--green);box-shadow:0 0 0 3px rgba(64,200,120,.16)}
.tab.s-verifica .led{background:var(--gray);animation:pulse 1.1s infinite}
.tab.s-sveglia .led{background:var(--lilac);animation:pulse .9s infinite}
.tab.s-giu     .led{background:#6b5560;box-shadow:0 0 0 3px rgba(255,255,255,.04)}
@keyframes pulse{50%{opacity:.3}}

/* assistente al telefono: numero + switch */
.asst-wrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-right:6px;padding:3px 8px;border:1px solid var(--soft);border-radius:999px;background:rgba(255,255,255,.03)}
.asst-num{color:var(--lilac);font-weight:800;font-size:12.5px;text-decoration:none;white-space:nowrap}
.asst-num:hover{text-decoration:underline}
.asst-lab{color:var(--gray);font-size:11px}
.sub.asst{padding:4px 9px;font-size:11.5px;font-weight:700}
.asst-msg{color:var(--gray);font-size:11px;min-width:0}
/* subtab toolbar */
.toolbar{display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--black);border-bottom:1px solid var(--soft);flex:none;flex-wrap:wrap}
.sub{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--gray);background:var(--surface);border:1px solid var(--soft);
padding:8px 13px;border-radius:9px;cursor:pointer;transition:.15s;white-space:nowrap}
.sub:hover{color:var(--white);border-color:var(--border)}
.sub.on{color:var(--black);background:var(--grad);border-color:transparent}
.sub small{opacity:.7;font-weight:500;margin-left:5px}
.sub.on small{color:#3a2b50;opacity:.85}
.toolbar .sp{flex:1}
/* ⚙️ (20/08) LA META' INVISIBILE DEL PRODOTTO. Le schermate raccontano cosa si apre; questa
   riga racconta cosa il sistema fa DA SOLO — il bot che prenota, il promemoria, il buono che
   matura, la recensione chiesta il giorno dopo. Chi guarda solo le schermate vede un
   gestionale, non un sistema che lavora anche quando il locale e' chiuso.
   `flex-basis:100%` la manda a capo dentro la barra, che ha gia' flex-wrap: nessun layout
   nuovo da mantenere. */
.auto{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:3px;padding-top:10px;border-top:1px solid var(--soft)}
.auto b{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gray);margin-right:2px}
.auto span{font-size:12px;line-height:1.35;color:var(--gray);background:rgba(255,255,255,.04);border:1px solid var(--soft);border-radius:999px;padding:4px 10px}
.act{font-family:inherit;font-size:12.5px;font-weight:700;color:var(--white);background:var(--surface2);border:1px solid var(--border);
padding:8px 13px;border-radius:9px;cursor:pointer;transition:.15s;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.act:hover{background:#1e2030}

/* viewport */
.stage{flex:1;position:relative;background:#fff;min-height:0}
#view{width:100%;height:100%;border:0;display:block;background:#fff}
.stage.mob{background:radial-gradient(420px 320px at 50% 30%,rgba(139,111,184,.14),#0a0b0f);display:flex;align-items:center;justify-content:center}
.stage.mob #view{width:380px;max-width:90%;height:95%;max-height:800px;border:none;border-radius:44px;background:#000;box-shadow:0 0 0 2px rgba(201,169,233,.22),0 0 0 12px #15161e,0 0 0 13px rgba(255,255,255,.05),0 44px 96px -26px rgba(0,0,0,.95)}
.over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
background:var(--black);color:var(--gray);text-align:center;padding:30px}
.over.show{display:flex}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(201,169,233,.25);border-top-color:var(--lilac);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.over b{color:var(--white);font-size:16px;font-weight:700}
.over span{font-size:13px;max-width:340px}

/* SCHERMI STRETTI — il pannello nasce per il desktop, ma il link viene mandato ai
   clienti su WhatsApp e loro lo aprono dal telefono. Lì la quarta scheda
   ("Parrucchiere · Salone") sbordava di 65px e trascinava di lato TUTTA la pagina.
   Ora le due barre scorrono per conto loro e la pagina resta ferma. */
.tabs,.toolbar{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none}
.tabs::-webkit-scrollbar,.toolbar::-webkit-scrollbar{display:none}
.tab,.sub,.act{flex:none}
@media (max-width:820px){
  html{overflow-x:hidden}
  .bar{padding:9px 12px}
  .logo{height:25px}
  .tabs{flex-wrap:nowrap;padding:8px 10px 0;gap:4px}
  .tab{font-size:12.5px;padding:9px 12px;gap:7px;white-space:nowrap}
  .toolbar{flex-wrap:nowrap;padding:8px 10px;gap:6px}
  .toolbar .sp{display:none}
  .sub{font-size:11.5px;padding:7px 10px}
  .sub small{display:none}   /* i suggerimenti raddoppiano la larghezza di ogni bottone */
  .act{font-size:11.5px;padding:7px 10px}
  .over span{font-size:12.5px}
}
</style></head>
<body>
  <div class="bar">
    <img class="logo" src="boosted_logo_h.png" alt="Boosted Company">
    <div class="w" style="display:none"><b>BOOSTED</b><span>COMPANY</span></div>
    <div class="sp"></div>
    <div class="hint">Pannello demo</div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="toolbar" id="toolbar"></div>

  <div class="stage">
    <!-- Niente "microphone": nessuna demo lo usa (verificato), e concedere il microfono
         a contenuto incorniciato senza motivo e' una superficie in piu' da giustificare.
         La fotocamera resta: serve allo scanner dei codici a barre. -->
    <iframe id="view" allow="camera; clipboard-write; fullscreen" referrerpolicy="no-referrer"></iframe>
    <div class="over show" id="over">
      <div class="spin" id="spin"></div>
      <b id="over-t">Carico…</b>
      <span id="over-s">Un attimo e la demo compare qui dentro.</span>
    </div>
  </div>

<script>
/* ===================================================================
   URL live dei due gestionali (ecommerce e ordini QR).
   Sono server Node: online vanno pubblicati su un host con processo
   persistente (Render/Railway/Fly). Finché questi restano vuoti, i due
   tab mostrano la demo interattiva statica (QR) o la presentazione.
   Appena metti gli URL qui, il pannello carica le app LIVE identiche a
   quelle di localhost — stesse schede (vetrina, operatori, scanner…).
   =================================================================== */
var LIVE = { ecom: "https://boosted-ecommerce.onrender.com", qr: "https://boosted-ordini-qr.onrender.com" };

// Stessi servizi/schede del pannello locale (launcher.mjs)
var DEMOS = [
  { id:'ecom', name:'Ecommerce', live:'ecom', screens:[
      { label:'Vetrina cliente', path:'/shop',       hint:'quello che vede il cliente', mobile:true },
      { label:'Operatori',       path:'/admin',       hint:'gestione ordini' },
      { label:'Scanner',         path:'/scanner',     hint:'barcode dal telefono', mobile:true },
      { label:'Titolare',        path:'/gestionale',  hint:'incassi e magazzino' },
      { label:'Marketing',       path:'/marketing',   hint:'email + WhatsApp' },
  ]},
  { id:'qr', name:'Ordini al tavolo · QR', live:'qr', demo:'boosted-ordini-qr.html', presentation:'Presentazione-Ordini-QR.html',
    // ⚙️ (20/08) Quello che il sistema fa SENZA che nessuno apra una pagina. Sta scritto qui
    //    perche' era la meta' invisibile del prodotto: un ristoratore che guarda solo le
    //    schermate vede un gestionale, non un sistema che lavora anche di notte.
    auto:[
      'Prende prenotazioni e ordini su WhatsApp, da solo',
      'Manda il promemoria il giorno prima e libera il tavolo se disdicono',
      'Avvisa quando l\'ordine è pronto o parte col fattorino',
      'Alla 4ª visita fa maturare un buono, e lo scala dal conto di quel tavolo',
      'Chiede la recensione il giorno dopo, e richiama chi non torna da mesi',
    ],
    screens:[
      { label:'Sito prenotazioni', path:'/demo',  hint:'lato cliente · prenota', mobile:true },
      { label:'Ordina & Ritira', path:'/asporto', hint:'ordini da casa: ritiro al banco o consegna a domicilio', mobile:true },
      { label:'Registro allergeni', path:'/allergeni', hint:'l\'obbligo di legge, sempre aggiornato', mobile:true },
      { label:'Sala / Staff', path:'/staff',      hint:'sala, comande e buono fedeltà sul conto' },
      { label:'Cucina (KDS)', path:'/kds',        hint:'schermo comande' },
      { label:'Cameriere',    path:'/cameriere',  hint:'ordini dal telefono', mobile:true },
      { label:'Console titolare', path:'/console', hint:'tutto quello che serve a decidere, su una schermata sola' },
      { label:'Titolare',     path:'/gestionale', hint:'incassi e listino' },
      { label:'Assistente',   path:'/assistente', hint:'chiamate + messaggi' },
      { label:'Marketing',    path:'/marketing',  hint:'email + WhatsApp' },
  ]},
  { id:'parrucchiere', name:'Parrucchiere · Salone', static:true, route:'demo-parrucchiere.html', screens:[
      { label:'Cliente · prenota', q:'kiosk=1&vista=cliente',     hint:'prenotazione online' },
      { label:'Agenda',            q:'kiosk=1&vista=agenda',      hint:'appuntamenti per operatore' },
      { label:'Schede clienti',    q:'kiosk=1&vista=clienti',     hint:'storico servizi, note e allergie per cliente' },
      { label:'Assistente',        q:'kiosk=1&vista=assistente',  hint:'voce AI che prenota da sola' },
      { label:'Poltrone',          q:'kiosk=1&vista=poltrone',    hint:'poltrone + scontrino a fine servizio' },
      { label:'Gestionale',        q:'kiosk=1&vista=report',      hint:'incassi giornalieri + listino' },
      { label:'Marketing',         q:'kiosk=1&vista=reputazione', hint:'email e WhatsApp promozionali' },
  ]},
];
var TABS = [{id:'intro',name:'▶ Come funziona',intro:true}].concat(DEMOS);
var active = 'intro';
var page = {};                 // id servizio -> indice pagina scelta
DEMOS.forEach(function(d){ page[d.id]=0; });

var tabsEl=document.getElementById('tabs'), toolEl=document.getElementById('toolbar');
var view=document.getElementById('view'), over=document.getElementById('over'),
    overT=document.getElementById('over-t'), overS=document.getElementById('over-s'), spin=document.getElementById('spin');

function svc(id){ return TABS.find(function(d){return d.id===id}); }
function liveUrl(d){ return d.live && LIVE[d.live] ? LIVE[d.live].replace(/\/+$/,'') : ''; }
// Schede effettive: se c'è il backend live usa le sue (identiche a localhost);
// altrimenti, se esiste una demo statica interattiva la mostra (+ presentazione).
function screensOf(d){
  if(!d.static && !liveUrl(d) && (d.demo||d.presentation)){
    var out=[];
    if(d.demo) out.push({label:'Demo interattiva', demo:d.demo, hint:'provala tu', mobile:true});
    if(d.presentation) out.push({label:'Presentazione', pres:d.presentation, hint:'come funziona, passo-passo'});
    return out;
  }
  return d.screens;
}

/* STATO REALE DEI SERVIZI.
   Prima il pallino era verde SEMPRE: bastava che l'URL fosse scritto qui dentro,
   nessuno controllava che il servizio rispondesse davvero. Davanti a un cliente
   significava dichiarare "online" un gestionale che poteva essere spento.
   Ora il verde si accende solo dopo una risposta vera. */
var STATO = {};   // id -> 'verifica' | 'sveglia' | 'pronto' | 'giu'
function statoDi(d){
  // L'ORDINE CONTA. Prima mettevo per primi i file statici, ma "Ordini al tavolo" ha
  // SIA un backend live SIA una demo statica di scorta: risultava verde comunque, cioe'
  // esattamente il claim falso che volevo togliere. Se c'e' un backend, e' lui a decidere,
  // perche' e' lui quello che il pannello carica davvero.
  if(liveUrl(d)) return STATO[d.id] || 'verifica';
  if(d.intro || d.static || d.demo || d.presentation) return 'pronto'; // file qui accanto: ci sono di sicuro
  return 'giu';
}
function renderTabs(){
  tabsEl.innerHTML = TABS.map(function(d){
    var st = statoDi(d);
    var titolo = { pronto:'servizio raggiungibile', verifica:'sto controllando…',
                   sveglia:'si sta accendendo (server gratuito)', giu:'non raggiungibile' }[st];
    var cls='tab'+(d.id===active?' on':'')+' s-'+st;
    return '<button class="'+cls+'" onclick="selectService(\''+d.id+'\')" title="'+d.name+' — '+titolo+'"><span class="led"></span>'+d.name+'</button>';
  }).join('');
}
/* ---- Assistente al telefono: numero da chiamare + switch ristorante/salone ----
   Un solo numero risponde per entrambe le demo: qui si scegle CHI risponde.
   Il comando va al server dell'assistente (che tiene l'attività attiva). */
var AGENTE = 'https://87-106-50-184.sslip.io';
var NUMERO_ASSISTENTE = '0557478983';
var venueAttiva = null;
function assistenteHTML(atteso){
  var on = function(v){ return venueAttiva===v ? ' on' : ''; };
  return '<span class="asst-wrap">'
    + '<a class="asst-num" href="tel:+39' + NUMERO_ASSISTENTE + '" title="Chiama l\'assistente vocale">📞 ' + NUMERO_ASSISTENTE + '</a>'
    + '<span class="asst-lab">risponde:</span>'
    + '<button class="sub asst' + on('ristorante') + '" onclick="switchAssistente(\'ristorante\')">Ristorante</button>'
    + '<button class="sub asst' + on('parrucchiere') + '" onclick="switchAssistente(\'parrucchiere\')">Salone</button>'
    + '<span class="asst-msg" id="asstMsg"></span>'
    + '</span>';
}
function switchAssistente(v){
  var m=document.getElementById('asstMsg'); if(m) m.textContent='…';
  fetch(AGENTE+'/set?venue='+v).then(function(r){return r.json()}).then(function(d){
    if(d && d.ok){ venueAttiva=d.attivita; renderToolbar();
      var m2=document.getElementById('asstMsg');
      if(m2) m2.textContent = '✓ ora risponde come ' + (v==='ristorante'?'ristorante':'salone');
    } else { if(m) m.textContent='✗ non riuscito'; }
  }).catch(function(){ var m3=document.getElementById('asstMsg'); if(m3) m3.textContent='✗ assistente non raggiungibile'; });
}
function leggiVenue(){
  fetch(AGENTE+'/health').then(function(r){return r.json()}).then(function(d){
    if(d && d.attivita){ venueAttiva=d.attivita; renderToolbar(); }
  }).catch(function(){});
}

function renderToolbar(){
  var d=svc(active);
  if(d.intro){
    toolEl.innerHTML = '<span class="sub on" style="cursor:default">Presentazione animata</span>'
      + '<span style="color:var(--gray);font-size:12.5px;margin-left:4px">Come funzionano i tre sistemi, passo-passo</span>'
      + '<div class="sp"></div>'
      + '<a class="act" href="presentazione-boosted.html" target="_blank" rel="noopener">↗ A tutto schermo</a>';
    return;
  }
  if(d.static){
    var subsS=d.screens.map(function(s,i){
      return '<button class="sub'+(i===page[active]?' on':'')+'" onclick="selectPage('+i+')">'+s.label+'<small>'+s.hint+'</small></button>';
    }).join('');
    var curS=d.screens[page[active]];
    toolEl.innerHTML = subsS
      + '<div class="sp"></div>'
      + (d.id==='parrucchiere' ? assistenteHTML() : '')
      + '<button class="act" onclick="reloadView()">↻ Ricarica</button>'
      + '<a class="act" href="'+d.route+(curS.q?('?'+curS.q):'')+'" target="_blank" rel="noopener">↗ A tutto schermo</a>';
    return;
  }
  var scr=screensOf(d);
  var subs=scr.map(function(s,i){
    return '<button class="sub'+(i===page[active]?' on':'')+'" onclick="selectPage('+i+')">'+s.label+'<small>'+s.hint+'</small></button>';
  }).join('');
  var cur=scr[page[active]]||scr[0];
  var full = cur.demo ? cur.demo
           : cur.pres ? cur.pres
           : (liveUrl(d)? liveUrl(d)+cur.path : '#');
  toolEl.innerHTML = subs
    + '<div class="sp"></div>'
    + (d.id==='qr' ? assistenteHTML() : '')
    + '<button class="act" onclick="reloadView()">↻ Ricarica</button>'
    + '<a class="act" href="'+full+'" target="_blank" rel="noopener">↗ A tutto schermo</a>'
    + (d.auto && d.auto.length ? autoHTML(d.auto) : '');
}

/* La riga «funziona anche da solo»: si disegna solo se il servizio la dichiara (campo `auto`).
   Niente promesse in piu' di quelle che le demo mantengono davvero — stessa regola dei meta
   tag di anteprima qui sopra. */
function autoHTML(a){
  return '<div class="auto"><b>Funziona anche da solo</b>'
    + a.map(function(x){ return '<span>' + x + '</span>'; }).join('') + '</div>';
}

function loadView(){
  var d=svc(active), stage=document.querySelector('.stage');
  if(d.intro){
    stage.classList.remove('mob');
    setSrc('presentazione-boosted.html', 'Carico la presentazione…');
    return;
  }
  if(d.static){
    stage.classList.remove('mob');
    var ss=d.screens[page[active]];
    setSrc(d.route+(ss.q?('?'+ss.q):''), 'Carico la demo…');
    return;
  }
  var scr=screensOf(d), s=scr[page[active]]||scr[0];
  stage.classList.toggle('mob', !!(s && s.mobile));
  if(s && s.demo){ setSrc(s.demo, 'Carico la demo…'); return; }
  if(s && s.pres){ setSrc(s.pres, 'Carico la presentazione…'); return; }
  var base=liveUrl(d);
  if(base){ setSrc(base+s.path, 'Carico la demo live…', true); return; }
  // nessun backend e nessuna demo: messaggio nello stile del pannello
  view.removeAttribute('src');
  spin.style.display='none';
  overT.textContent='Versione live in arrivo';
  overS.textContent='Il gestionale completo di questo servizio sta per andare online.';
  over.classList.add('show');
}
/* ATTESA ONESTA.
   Prima, se il server ci metteva un minuto a rispondere, girava una rotellina muta
   e chi guardava pensava che fosse rotto; se non rispondeva affatto, la rotellina
   girava per sempre. Ora dopo qualche secondo si spiega COSA sta succedendo, e dopo
   90 secondi si smette di far finta e si offre di riprovare. */
var attese=[];
function pulisciAttese(){ attese.forEach(clearTimeout); attese=[]; }
function setSrc(url, loadingMsg, live){
  pulisciAttese();
  spin.style.display=''; overT.textContent=loadingMsg||'Carico…'; overS.textContent=''; over.classList.add('show');
  if(live){
    attese.push(setTimeout(function(){
      overS.textContent='Il server si sta accendendo. È un piano gratuito: si spegne quando resta inutilizzato, e la prima apertura richiede circa 40 secondi. Le successive sono immediate.';
    }, 3500));
    attese.push(setTimeout(function(){
      spin.style.display='none';
      overT.textContent='Il server non risponde';
      overS.innerHTML='Non è riuscito ad accendersi in 90 secondi.<br><button class="act" style="margin-top:14px" onclick="reloadView()">↻ Riprova</button>';
    }, 90000));
  }
  if(view.getAttribute('src')!==url){ view.setAttribute('src',url); } else { pulisciAttese(); over.classList.remove('show'); }
}
view.addEventListener('load', function(){ if(view.getAttribute('src')){ pulisciAttese(); over.classList.remove('show'); } });

/* PRE-RISCALDAMENTO. I due gestionali stanno su un piano gratuito: dopo un po' di
   inattività il server si spegne, e la prima richiesta impiega ~50 secondi a
   risvegliarlo. Davanti a un cliente sono cinquanta secondi di schermo fermo.
   Appena si apre il pannello li chiamiamo: mentre il cliente guarda la
   presentazione, i server si accendono in sottofondo e al clic sono già pronti.
   La stessa chiamata dice anche se il servizio risponde davvero → colore del pallino. */
function controllaServizio(d){
  var base=liveUrl(d); if(!base) return;
  STATO[d.id]='verifica'; renderTabs();
  var lento=setTimeout(function(){ if(STATO[d.id]==='verifica'){ STATO[d.id]='sveglia'; renderTabs(); } }, 2500);
  var ctrl = (typeof AbortController!=='undefined') ? new AbortController() : null;
  var stop=setTimeout(function(){ if(ctrl) ctrl.abort(); }, 90000);
  fetch(base+'/api/config', ctrl?{cache:'no-store',signal:ctrl.signal}:{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(){ STATO[d.id]='pronto'; }, function(){ STATO[d.id]='giu'; })
    .then(function(){ clearTimeout(lento); clearTimeout(stop); renderTabs(); });
}
function svegliaTutti(){ TABS.forEach(function(d){ if(liveUrl(d)) controllaServizio(d); }); }

function selectService(id){ active=id; if(page[active]==null)page[active]=0; renderTabs(); renderToolbar(); loadView(); leggiVenue();
  // se risultava spento, ricontrolla: potrebbe essersi acceso nel frattempo
  var sv=svc(id); if(sv && liveUrl(sv) && STATO[id]==='giu') controllaServizio(sv); }
function selectPage(i){ page[active]=i; renderToolbar(); loadView(); }
function reloadView(){ var s=view.getAttribute('src'); if(s){ over.classList.add('show'); overT.textContent='Carico…'; view.setAttribute('src', s); } }

renderTabs(); renderToolbar(); loadView();
svegliaTutti();   // i server gratuiti si accendono ORA, mentre il cliente guarda la presentazione

/* Avviso cookie onesto: qui usiamo solo spazio di sessione tecnico (nessun cookie di
   profilazione o di terze parti). Mostrato una volta, memorizza la conferma. */
(function(){
  try{ if(localStorage.getItem('bv-cookie-ok'))return; }catch(e){}
  var b=document.createElement('div');
  // In FLUSSO, non sovrapposto: prima era fissato in basso al centro e copriva
  // i comandi della presentazione (play/pausa e avanzamento). Ora e' l'ultima
  // riga della colonna: lo stage si accorcia di qualche pixel e non nasconde nulla.
  b.style.cssText='flex:none;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#171922;border-top:1px solid rgba(201,169,233,.22);padding:11px 16px;font-size:12.5px;color:#d7dae0';
  b.innerHTML='<span style="flex:1;min-width:200px">🔒 Usiamo solo cookie tecnici necessari al funzionamento. Nessuna profilazione, nessun cookie di terze parti. <a href="privacy.html" style="color:#C9A9E9">Informativa privacy</a>.</span><button id="ckok" style="font-family:inherit;font-weight:700;font-size:13px;color:#08090A;background:linear-gradient(150deg,#C9A9E9,#8B6FB8);border:0;border-radius:9px;padding:8px 15px;cursor:pointer;white-space:nowrap">Ho capito</button>';
  document.body.appendChild(b);
  b.querySelector('#ckok').onclick=function(){ try{localStorage.setItem('bv-cookie-ok','1');}catch(e){} b.remove(); };
})();
</script>
