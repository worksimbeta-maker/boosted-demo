<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boosted · Come funzionano i sistemi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{
  --black:#08090A;--bar:#0d0e12;--surface:#121319;--surface2:#171922;--card:#0e0f15;
  --soft:rgba(255,255,255,.07);--border:rgba(201,169,233,.18);
  --lilac:#C9A9E9;--purple:#8B6FB8;--grad:linear-gradient(150deg,#C9A9E9,#8B6FB8);
  --text:#F7F8F8;--text2:#AAB0BB;--text3:#9CA2AD;--faint:#6B7280;
  --green:#3fb874;--amber:#E0962A;--amber-t:#F3C684;--green-t:#bff3d2;--red:#ff7a72;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:22px;
  --sh-card:0 22px 50px -26px rgba(0,0,0,.85),0 0 0 1px var(--soft),inset 0 1px 0 rgba(255,255,255,.04);
  --sh-dev:0 50px 92px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:var(--black);color:var(--text);
display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1,'cv05' 1}

/* ---------- header ---------- */
.head{position:relative;z-index:6;display:flex;align-items:center;gap:13px;padding:11px 26px}
.logo{height:30px;width:auto;display:block}
.head .w{display:flex;flex-direction:column;line-height:1}
.head .w b{font-size:13px;font-weight:800;letter-spacing:.18em}
.head .w span{font-size:8px;font-weight:600;letter-spacing:.34em;color:var(--text3);margin-top:4px}
.switch{margin-left:auto;display:flex;gap:5px;background:var(--surface);border:1px solid var(--soft);padding:4px;border-radius:12px}
.switch button{font-family:inherit;font-size:12.5px;font-weight:700;color:var(--text3);background:transparent;border:none;padding:8px 15px;border-radius:9px;cursor:pointer;transition:.16s}
.switch button:hover{color:var(--text)}
.switch button.on{color:var(--black);background:var(--grad);box-shadow:0 7px 18px -7px rgba(201,169,233,.6)}

/* ---------- flow rail (mappa-percorso) ---------- */
.rail{position:relative;z-index:6;display:flex;gap:22px;padding:2px 26px 8px;align-items:flex-end;overflow:hidden}
.rail.hidden{visibility:hidden}
.actg{display:flex;flex-direction:column;gap:7px}
.actg .al{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);padding-left:2px}
.actg.cur .al{color:var(--lilac)}
.nodes{display:flex;gap:6px}
.node{font-family:inherit;display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--soft);color:var(--text3);
font-size:11.5px;font-weight:600;padding:6px 11px 6px 7px;border-radius:999px;cursor:pointer;transition:.18s;white-space:nowrap}
.node .num{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:800;background:var(--surface2);color:var(--text3);transition:.18s}
.node:hover{color:var(--text);border-color:var(--border)}
.node.done{color:var(--text2);border-color:var(--soft)}
.node.done .num{background:var(--purple);color:#1a1226}
.node.on{color:var(--black);background:var(--grad);border-color:transparent;box-shadow:0 8px 20px -8px rgba(201,169,233,.6)}
.node.on .num{background:rgba(26,18,38,.25);color:#1a1226}
.node .nlab{max-width:0;overflow:hidden;opacity:0;transition:.22s}
.node:hover .nlab{max-width:130px;opacity:1}
.node{cursor:pointer}
.node.on .nlab{max-width:120px;opacity:1}

/* ---------- film / stage ---------- */
.film{position:relative;flex:1;overflow:hidden;cursor:pointer}
.phint{font-size:10.5px;color:var(--text3);white-space:nowrap;margin-left:8px;opacity:.8}
.film::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 680px at 66% 44%,rgba(139,111,184,.16),transparent 62%)}
.film::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;box-shadow:inset 0 0 240px 60px rgba(0,0,0,.5)}
.layer{position:absolute;inset:0;z-index:1;display:grid;place-items:center;opacity:0;will-change:opacity,transform}
.frame{width:900px;height:350px;display:flex;align-items:center;justify-content:center;gap:56px;position:relative;transform-origin:center}
.scene{position:relative;display:flex;align-items:center;justify-content:center;min-height:318px;order:2}
.scene::before{content:"";position:absolute;bottom:4%;left:50%;width:50%;height:26px;transform:translateX(-50%);background:rgba(0,0,0,.55);filter:blur(22px);z-index:-1}
.scene::after{content:"";position:absolute;bottom:1%;left:50%;width:72%;height:64px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(139,111,184,.32),transparent 72%);filter:blur(34px);z-index:-2;pointer-events:none}
.badge{position:absolute;top:-6px;left:-6px;width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--lilac);z-index:6;box-shadow:0 8px 18px -8px rgba(0,0,0,.8)}

.cap{order:1;display:flex;flex-direction:column;align-items:flex-start;text-align:left;max-width:340px;padding-left:20px;border-left:2px solid transparent;border-image:var(--grad) 1}
.kick{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--text3)}
.kick .adot{width:8px;height:8px;border-radius:50%;background:var(--lilac)}
.cap h2{font-size:clamp(26px,3.2vw,40px);font-weight:700;letter-spacing:-.025em;line-height:1.04;margin:14px 0 12px}
.cap p{font-size:15px;color:var(--text2);line-height:1.45;max-width:300px}

.anim{will-change:transform,opacity}

/* ---------- cover (apertura / chiusura) ---------- */
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;width:100%}
.cover .clogo{height:120px;width:auto}
.cover .ck{font-size:12px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cover h1{font-size:clamp(30px,4.6vw,54px);font-weight:800;letter-spacing:-.03em;line-height:1.03;max-width:760px}
.cover p{font-size:clamp(15px,1.9vw,19px);color:var(--text2);max-width:560px}
.cover .bl{margin-top:6px;font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--text3)}

/* ======================= MOCKUPS ======================= */
.phone{width:200px;height:330px;border-radius:42px;background:#16171f;border:0;padding:9px;position:relative;box-shadow:var(--sh-dev)}
.phone::before{content:"";position:absolute;top:15px;left:50%;transform:translateX(-50%);width:78px;height:20px;border-radius:12px;background:#000;z-index:5}
.scr{position:absolute;inset:9px;border-radius:36px;overflow:hidden;background:linear-gradient(180deg,#15161d,#0e0f15);display:flex;flex-direction:column}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:9px 18px 4px;font-size:10px;font-weight:600;color:var(--text2)}
.sbar .r{display:flex;gap:4px;align-items:center}
.scrtop{padding:8px 14px 9px;font-size:11.5px;font-weight:700;color:var(--text);border-bottom:1px solid var(--soft);display:flex;justify-content:space-between;align-items:center}
.scrtop .lang{font-size:9.5px;color:var(--text3);font-weight:600;border:1px solid var(--soft);border-radius:5px;padding:2px 6px}
.catrow{display:flex;gap:5px;padding:9px 12px;overflow:hidden;border-bottom:1px solid var(--soft)}
.catpill{font-size:10px;font-weight:700;padding:5px 9px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid var(--soft);color:var(--text3);white-space:nowrap}
.catpill.on{background:rgba(201,169,233,.14);color:var(--lilac);border-color:var(--border)}
.mItem{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--soft);font-size:13px;gap:8px;line-height:1.35}
.mItem b{font-weight:600;display:block}.mItem .al{color:var(--text3);font-size:10px;margin-top:2px}
.mItem .pz{color:var(--text);font-weight:700;font-size:13px;white-space:nowrap}
.note{font-size:10.5px;color:var(--amber-t);padding:3px 14px}
.cartbar{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:13px 14px;background:var(--grad);color:#1a1226;font-weight:800;font-size:13px}
.badge2{display:inline-grid;place-items:center;min-width:21px;height:21px;border-radius:11px;background:#1a1226;color:var(--text);font-size:11px;padding:0 6px}
.qrbox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative}
.qr{width:128px;height:128px;border-radius:14px;background:#fff;position:relative;padding:12px;
  background-image:radial-gradient(circle,#0e0f15 38%,transparent 40%);background-size:11px 11px;background-position:8px 8px;border:7px solid #fff}
.fp{position:absolute;width:30px;height:30px;background:#0e0f15;border-radius:4px;box-shadow:inset 0 0 0 4px #0e0f15,inset 0 0 0 9px #fff}
.fp.tl{top:9px;left:9px}.fp.tr{top:9px;right:9px}.fp.bl{bottom:9px;left:9px}
.beamline{position:absolute;left:6%;right:6%;height:2px;background:var(--lilac);box-shadow:0 0 14px 3px rgba(201,169,233,.7);top:8%;z-index:2}
.qrlabel{font-size:11px;color:var(--text3);text-align:center;padding:0 22px}
.frm{padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.frm .fl{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--soft)}
.frm .fl .muted{color:var(--text3)}

/* duo: telefono -> schermo cucina (l'ordine vola) */
.duo{position:relative;display:flex;align-items:center;gap:26px}
.duo .arr{position:absolute;left:150px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:17px;z-index:1}
.mphone{position:relative;width:150px;height:306px;border-radius:30px;background:#16171f;padding:7px;flex:none;box-shadow:var(--sh-dev)}
.mphone::before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);width:54px;height:15px;border-radius:9px;background:#000;z-index:5}
.ms{position:absolute;inset:7px;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#15161d,#0e0f15);display:flex;flex-direction:column}
.ms .mt{padding:22px 12px 9px;font-size:10.5px;font-weight:700;color:var(--text);border-bottom:1px solid var(--soft)}
.ms .mrow{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;font-size:11px;border-bottom:1px solid var(--soft);gap:6px}
.ms .mrow .pz{color:var(--text);font-weight:700;white-space:nowrap}
.ms .send{margin-top:auto;background:var(--grad);color:#1a1226;font-weight:800;font-size:11.5px;padding:12px;text-align:center}
.kmon{position:relative;width:206px;flex:none}
.kscreen{width:214px;height:202px;background:var(--card);border:1px solid var(--soft);border-radius:14px;box-shadow:var(--sh-card);padding:13px;position:relative;overflow:hidden}
.kscreen .kh{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);display:flex;justify-content:space-between;margin-bottom:9px}
.kscreen .empty{position:absolute;inset:34px 0 0;display:grid;place-items:center;color:var(--faint);font-size:11px}
.kt{background:var(--surface2);border:1px solid var(--soft);border-left:3px solid var(--lilac);border-radius:10px;padding:9px 10px}
.kt .ktt{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;margin-bottom:5px}
.kt .ktt b{color:var(--lilac)}
.kt .ktl{font-size:10px;color:var(--text2);padding:1px 0}
.kt .kc{font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:6px 0 1px}
.kding{position:absolute;top:9px;right:9px;background:var(--green);color:#03260f;font-size:9px;font-weight:800;padding:4px 8px;border-radius:7px;opacity:0;z-index:6;box-shadow:0 6px 14px -6px rgba(0,0,0,.7)}
.kstand{width:10px;height:16px;background:#16171f;border-radius:0 0 4px 4px;margin:0 auto}
.kbase{width:84px;height:6px;background:#101118;border-radius:3px;margin:3px auto 0;box-shadow:0 10px 18px -8px rgba(0,0,0,.8)}
.flyt{position:absolute;left:62px;top:236px;z-index:5;opacity:0;background:#fff;color:#16171f;border-radius:8px;padding:6px 9px;font-size:10px;font-weight:800;box-shadow:0 12px 26px -8px rgba(0,0,0,.75);white-space:nowrap}

.panelm{width:318px;background:var(--card);border:1px solid var(--soft);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-card);position:relative}
.panelm h4{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pinhint{font-size:9.5px;color:var(--purple);border:1px solid var(--border);border-radius:5px;padding:2px 7px;white-space:nowrap}
.lrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:9px 0;border-bottom:1px solid var(--soft);gap:8px;line-height:1.3}
.lrow:last-child{border:none}
.lrow .muted{color:var(--text3);font-size:12px}
.lrow.tot{font-weight:800;font-size:16px;padding-top:11px}
.lrow.tot .e{color:var(--text)}
.cut{color:var(--text3);text-decoration:line-through;font-size:12px}
.coupon{display:inline-flex;gap:7px;align-items:center;background:rgba(63,184,116,.13);color:var(--green-t);border:1px solid rgba(63,184,116,.34);font-size:11.5px;font-weight:700;padding:7px 11px;border-radius:var(--r-sm);margin:8px 0}
.btnbig{display:block;text-align:center;background:var(--grad);color:#1a1226;font-weight:800;font-size:13px;padding:12px;border-radius:var(--r-md);margin-top:8px}
.okpop{display:inline-flex;gap:7px;align-items:center;color:var(--green-t);background:rgba(63,184,116,.13);border:1px solid rgba(63,184,116,.38);font-weight:700;font-size:12.5px;padding:9px 13px;border-radius:var(--r-sm);margin-top:10px}
.scontrino{background:#f7f5f0;color:#1a1a1a;font-family:ui-monospace,Menlo,monospace;font-size:10px;line-height:1.55;padding:12px 15px;border-radius:5px;box-shadow:0 16px 34px -12px rgba(0,0,0,.65);margin-top:12px;transform-origin:top}
.scontrino .sh{text-align:center;font-weight:800;letter-spacing:.06em;font-size:9.5px;border-bottom:1px dashed #b9b3a6;padding-bottom:7px;margin-bottom:7px}
.scontrino .sl{display:flex;justify-content:space-between;padding:2px 0}
.scontrino .sl.tt{font-weight:800;border-top:1px dashed #b9b3a6;margin-top:6px;padding-top:6px;font-size:11px}
.scontrino .sf{text-align:center;color:#8a8578;font-size:8px;margin-top:8px;border-top:1px dashed #b9b3a6;padding-top:7px}

.flow2{display:flex;align-items:center;gap:5px;margin:12px 0 4px;flex-wrap:wrap}
.chip{font-size:10.5px;font-weight:700;padding:6px 10px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid var(--soft);color:var(--text3);transition:.25s;min-width:96px;text-align:center;display:inline-grid;place-items:center;height:26px}
.chip.amber{background:rgba(224,150,42,.16);color:var(--amber-t);border-color:rgba(224,150,42,.4)}
.chip.green{background:rgba(63,184,116,.16);color:var(--green-t);border-color:rgba(63,184,116,.45)}
.chip.muted{background:var(--surface2);color:var(--text3);text-decoration:line-through}
.parr{color:var(--faint);font-size:11px}

.kds{width:300px;background:var(--card);border:1px solid var(--soft);border-radius:var(--r-lg);padding:14px;box-shadow:var(--sh-card)}
.kdsh{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);display:flex;justify-content:space-between;margin-bottom:10px}
.ticket{background:var(--surface2);border:1px solid var(--soft);border-left:3px solid var(--lilac);border-radius:var(--r-md);padding:11px 12px}
.ticket .tt{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:6px}
.ticket .tt .tav{color:var(--lilac)}
.crs{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--soft);font-size:12.5px;gap:8px;line-height:1.35}
.crs:last-child{border:none}
.crs .cn small{color:var(--text3);font-size:10px;margin-left:6px}
.crs.served .cn{color:var(--text3);text-decoration:line-through}
.crs .q{color:var(--text);font-weight:700}

.dash{width:318px;background:var(--card);border:1px solid var(--soft);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-card)}
.dash .dl{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text3)}
.dash .num{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1;margin:6px 0 3px}
.dash .num .cur{font-size:.55em;font-weight:600;color:var(--text3);vertical-align:.08em;margin-right:3px}
.dash .sub{font-size:12px;color:var(--green);font-weight:600}
.kpis{display:flex;gap:8px;margin-top:14px}
.kpi{flex:1;background:var(--surface2);border:1px solid var(--soft);border-radius:var(--r-md);padding:10px;text-align:center}
.kpi b{font-size:16px;font-weight:700;display:block}.kpi small{font-size:9.5px;color:var(--text3);letter-spacing:.04em}
.bars{display:flex;align-items:flex-end;gap:7px;height:58px;margin-top:16px;border-bottom:1px solid var(--soft);padding-bottom:1px}
.bars i{flex:1;background:rgba(201,169,233,.26);border-radius:4px 4px 0 0}
.bars i:last-child{background:var(--grad)}
.barx{display:flex;gap:7px;margin-top:5px}.barx span{flex:1;text-align:center;font-size:8px;color:var(--faint)}
.mini{margin-top:13px;font-size:12px;color:var(--text3);display:flex;justify-content:space-between;border-top:1px solid var(--soft);padding-top:10px}
.mini b{color:var(--text)}

.shop{width:318px;position:relative}
.cats{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prod{background:var(--surface);border:1px solid var(--soft);border-radius:var(--r-md);padding:11px;text-align:center;position:relative}
.prod.pick{border-color:var(--lilac);box-shadow:0 0 0 2px rgba(201,169,233,.25)}
.prod .ph{height:54px;border-radius:var(--r-sm);background:linear-gradient(135deg,#23202e,#181820);display:grid;place-items:center;font-size:25px;margin-bottom:9px}
.prod b{font-size:12px;display:block;line-height:1.25}.prod .pz{font-size:12px;color:var(--text);font-weight:700;margin-top:4px}
.taglow{position:absolute;top:8px;right:8px;background:rgba(224,150,42,.18);color:var(--amber-t);border:1px solid rgba(224,150,42,.36);font-size:9px;font-weight:700;padding:2px 6px;border-radius:6px}
.carticon{position:absolute;top:8px;right:10px;font-size:19px;color:var(--text2)}
.cbadge{position:absolute;top:-7px;right:-9px;min-width:17px;height:17px;border-radius:9px;background:var(--grad);color:#1a1226;font-size:10px;font-weight:800;display:grid;place-items:center;opacity:0;padding:0 3px}
.stbar{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:4px}.stbar i{display:block;height:100%;background:var(--grad)}
.fly{position:absolute;width:28px;height:28px;border-radius:var(--r-sm);background:var(--grad);display:grid;place-items:center;color:#1a1226;font-weight:800;font-size:12px;z-index:6;opacity:0;left:40%;top:55%}

.bigprod{width:296px;background:var(--card);border:1px solid var(--soft);border-radius:var(--r-lg);padding:17px;box-shadow:var(--sh-card)}
.bigprod .ph{height:98px;border-radius:var(--r-md);background:linear-gradient(135deg,#2a2440,#181820);display:grid;place-items:center;font-size:48px;margin-bottom:12px}
.bigprod .nm{font-size:17px;font-weight:600;letter-spacing:-.01em}.bigprod .pz{font-size:18px;font-weight:700;color:var(--text);margin-top:3px}
.bigprod .ds{font-size:12px;color:var(--text3);margin-top:5px}
.sizes{display:flex;gap:7px;margin-top:13px}
.sz{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--soft);border-radius:var(--r-sm);padding:8px 0;font-size:13px;font-weight:700;flex:1}
.sz small{font-size:9.5px;color:var(--text3);font-weight:600}

var DEFAULT_HOLD=5200;
var sys='qr', i=0, playing=true, timer=null, front='B', curTL=null, hovering=false;
var layA=document.getElementById('layA'), layB=document.getElementById('layB'),
    rail=document.getElementById('rail'), play=document.getElementById('play'),
    timerEl=document.getElementById('timer'), scount=document.getElementById('scount');

function list(){ return SCENES[sys]; }
function contentList(){ var a=[]; list().forEach(function(s,gi){ if(!s.cover) a.push({gi:gi,s:s}); }); return a; }

function buildRail(){
  var cl=contentList(), html='', curAct=null, n=0;
  cl.forEach(function(it){
    if(it.s.act!==curAct){ if(curAct!==null) html+='</div></div>'; html+='<div class="actg" data-act="'+it.s.act+'"><div class="al">'+it.s.act+'</div><div class="nodes">'; curAct=it.s.act; }
    n++;
    html+='<button class="node" data-gi="'+it.gi+'" onclick="goto('+it.gi+')"><span class="num">'+n+'</span><span class="nlab">'+it.s.tag+'</span></button>';
  });
  if(curAct!==null) html+='</div></div>';
  rail.innerHTML=html;
}
function paintRail(){
  var nodes=qa(rail,'.node');
  nodes.forEach(function(nd){ var gi=+nd.getAttribute('data-gi'); nd.classList.remove('on','done'); if(gi===i)nd.classList.add('on'); else if(gi<i)nd.classList.add('done'); });
  qa(rail,'.actg').forEach(function(g){ var act=g.getAttribute('data-act'); g.classList.toggle('cur', list()[i] && list()[i].act===act); });
  var cur=list()[i];
  rail.classList.toggle('hidden', !!(cur && cur.cover));
}

function show(){
  var sc=list()[i];
  var back=(front==='A')?layB:layA, frontEl=(front==='A')?layA:layB;
  var inner;
  if(sc.cover){ inner=sc.html; }
  else {
    var dot=DOT[sc.actor]||'#C9A9E9';
    inner='<div class="scene"><div class="badge">'+contentNum(i)+'</div>'+sc.html+'</div>'
      +'<div class="cap"><div class="kick"><span class="adot" style="background:'+dot+'"></span>'+sc.actorLabel+'</div><h2>'+sc.label+'</h2><p>'+sc.sub+'</p></div>';
  }
  back.innerHTML='<div class="frame">'+inner+'</div>'; fit();
  if(curTL){ try{curTL.progress(1).kill();}catch(e){} curTL=null; }
  if(G){
    G.killTweensOf([back,frontEl]);
    if(RM){ G.set(frontEl,{opacity:0}); G.set(back,{opacity:1,scale:1}); }
    else { G.set(back,{opacity:0,scale:1.03}); G.to(frontEl,{opacity:0,duration:.26,ease:'power2.in'}); G.to(back,{opacity:1,scale:1,duration:.44,ease:'power2.out',delay:.16}); }
  } else { back.style.opacity=1; frontEl.style.opacity=0; }
  front=(front==='A')?'B':'A';
  if(G && sc.anim){ try{ curTL=sc.anim(back); if(RM){curTL.progress(1);} }catch(e){ curTL=null; } }
  paintRail();
  scount.textContent=(i+1)+' / '+list().length;
  // timer
  var hold=sc.hold||DEFAULT_HOLD;
  document.documentElement.style.setProperty('--dur',(hold/1000)+'s');
  timerEl.classList.remove('run'); void timerEl.offsetWidth; if(playing && !RM && !hovering) timerEl.classList.add('run');
  schedule(hold);
}
function contentNum(gi){ var n=0; for(var k=0;k<=gi;k++){ if(!list()[k].cover) n++; } return n; }

function schedule(hold){ clearTimeout(timer); if(playing && !hovering) timer=setTimeout(function(){ i=(i+1)%list().length; show(); }, hold||DEFAULT_HOLD); }
function setPlayUI(){ document.body.classList.toggle('paused',!playing); play.textContent=playing?'⏸':'▶'; }
function togglePlay(){ playing=!playing; setPlayUI(); if(playing){ if(curTL) curTL.restart(); timerEl.classList.remove('run'); void timerEl.offsetWidth; if(!RM)timerEl.classList.add('run'); var sc=list()[i]; schedule(sc.hold||DEFAULT_HOLD); } else { clearTimeout(timer); if(curTL) curTL.pause(); } }
function step(d){ i=(i+d+list().length)%list().length; playing=true; setPlayUI(); show(); }
function goto(n){ i=n; playing=true; setPlayUI(); show(); }
function setSystem(s){
  if(s===sys) return;
  sys=s; i=0; playing=true;
  qa(document,'.switch button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-sys')===s); });
  buildRail(); setPlayUI(); show();
}
document.addEventListener('keydown',function(e){
  if(e.key===' '){ e.preventDefault(); togglePlay(); } else if(e.key==='ArrowRight'){ step(1); } else if(e.key==='ArrowLeft'){ step(-1); }
});
(function(){ var filmEl=document.querySelector('.film');
  filmEl.addEventListener('mouseenter',function(){ hovering=true; clearTimeout(timer); document.body.classList.add('paused'); });
  filmEl.addEventListener('mouseleave',function(){ hovering=false; if(playing){ document.body.classList.remove('paused'); var sc=list()[i]; timerEl.classList.remove('run'); void timerEl.offsetWidth; if(!RM)timerEl.classList.add('run'); schedule(sc.hold||DEFAULT_HOLD); } });
  filmEl.addEventListener('click',function(){ step(1); });
})();
buildRail(); setPlayUI(); show();
</script>
<script>
/* ===== BoostedVoice — simulazione chiamata (estratta dal componente del cliente) ===== */
(function(){
"use strict";
var CFG={ name:'Ristorante' };
function $(s){ return document.querySelector(s); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function bvOpenModal(html){ var p=$('#bvModalPanel'); if(!p)return; p.innerHTML=html; $('#bvModal').classList.add('open'); }
function bvCloseModal(){ var m=$('#bvModal'); if(m)m.classList.remove('open'); }
(function(){ var m=$('#bvModal'); if(m)m.addEventListener('click',function(e){ if(e.target.id==='bvModal')bvCloseModal(); }); })();
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ var m=$('#bvModal'); if(m&&m.classList.contains('open'))bvCloseModal(); } });
document.addEventListener('click',function(e){ if(e.target.closest&&e.target.closest('[data-bvclose]'))bvCloseModal(); });
var bvToken=0, bvBooking={}, bvConvaiLoaded=false, simN=0;
function bvAlive(my){ return my===bvToken && $('#bvModal').classList.contains('open') && !!document.getElementById('bvLog'); }
function bvWait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
function bvScroll(){ var l=document.getElementById('bvLog'); if(l)l.scrollTop=l.scrollHeight; }
function bvBubble(role,html){ var l=document.getElementById('bvLog'); if(!l)return null; var d=document.createElement('div'); d.className='bvb '+role; d.innerHTML=html; l.appendChild(d); bvScroll(); return d; }
async function bvSay(my,role,text,pre){ if(pre)await bvWait(pre); if(!bvAlive(my))return; var t=bvBubble(role,'<span class="bvtype"><i></i><i></i><i></i></span>'); await bvWait(Math.min(1500,520+text.length*19)); if(!bvAlive(my)||!t)return; t.innerHTML=text; bvScroll(); }
function bvChoose(my,opts){ return new Promise(function(res){ var c=document.getElementById('bvChoices'); if(!c){res(null);return;} c.innerHTML=opts.map(function(o,i){ return '<button class="bvc-choice" data-i="'+i+'">'+esc(o.label)+'</button>'; }).join(''); Array.prototype.forEach.call(c.querySelectorAll('.bvc-choice'),function(b){ b.addEventListener('click',function(){ if(!bvAlive(my))return; var o=opts[+b.dataset.i]; c.innerHTML=''; bvBubble('caller',esc(o.say||o.label)); res(o); }); }); }); }
function bvTool(my,label,result){ return new Promise(function(res){ var l=document.getElementById('bvLog'); if(!l){res();return;} var d=document.createElement('div'); d.className='bvtool'; d.innerHTML='<span class="bvt-spin"></span> '+esc(label); l.appendChild(d); bvScroll(); setTimeout(function(){ if(d.isConnected){ d.classList.add('done'); d.innerHTML='<span class="bvt-ok">✓</span> '+esc(label)+' · <b>'+esc(result)+'</b>'; bvScroll(); } res(); },1150); }); }
function bvPhone(){ simN++; return '+39 333 '+(100+simN%900)+' '+(1000+(simN*37)%9000); }
function mountBvConvai(){ var slot=document.getElementById('bvConvai'); if(!slot||slot.children.length)return; var el=document.createElement('elevenlabs-convai'); el.setAttribute('agent-id','agent_1501kvg8ar32e7f9javsc99wt2yf'); try{ el.setAttribute('dynamic-variables',JSON.stringify({current_date:new Date().toLocaleDateString('it-IT',{weekday:'long',year:'numeric',month:'long',day:'numeric'})})); }catch(e){} slot.appendChild(el); if(!bvConvaiLoaded){ bvConvaiLoaded=true; var s=document.createElement('script'); s.src='https://unpkg.com/@elevenlabs/convai-widget-embed'; s.async=true; document.body.appendChild(s); } }
window.bvOpen=function(){
  try{ window.playing=false; if(typeof window.setPlayUI==='function')window.setPlayUI(); if(window.timer)clearTimeout(window.timer); }catch(e){}
  var my=++bvToken; bvBooking={};
  bvOpenModal('<div class="bvc"><div class="bvc-tabs"><button class="bvc-tab on" id="bvTabChat">💬 Simulazione</button><button class="bvc-tab" id="bvTabVoice">🎙 Voce dal vivo</button><button class="bvc-x" data-bvclose aria-label="Chiudi">✕</button></div>'
    +'<div id="bvChatPane"><div class="bvc-head"><span class="bvc-orb live" id="bvOrb"></span><div style="min-width:0"><b>'+esc(CFG.name)+'</b><div class="bvc-st" id="bvStatus">L’assistente risponde…</div></div><span class="bvc-rec">● REC</span></div><div class="bvc-log" id="bvLog"></div><div class="bvc-choices" id="bvChoices"></div></div>'
    +'<div id="bvVoicePane" hidden><div class="bvc-voicewrap"><p class="bvc-vlead">Parla davvero con l’assistente: tocca il pulsante di chiamata, dai il consenso al microfono e prova a prenotare a voce. È lo stesso bot che risponde al telefono del ristorante.</p><div id="bvConvai"></div><p class="bvc-vnote">Conversazione reale gestita dall’AI · serve microfono e internet.</p></div></div></div>');
  var tc=$('#bvTabChat'), tv=$('#bvTabVoice');
  if(tc)tc.addEventListener('click',function(){ tc.classList.add('on'); tv.classList.remove('on'); $('#bvChatPane').hidden=false; $('#bvVoicePane').hidden=true; });
  if(tv)tv.addEventListener('click',function(){ tv.classList.add('on'); tc.classList.remove('on'); $('#bvVoicePane').hidden=false; $('#bvChatPane').hidden=true; mountBvConvai(); });
  bvRun(my);
};
async function bvRun(my){
  var orb=document.getElementById('bvOrb'), st=document.getElementById('bvStatus');
  if(orb)orb.classList.add('live'); if(st)st.textContent='In chiamata…';
  await bvSay(my,'ai',CFG.name+', buonasera! Sono l’assistente. Posso aiutarla con una prenotazione o darle un’informazione.',450); if(!bvAlive(my))return;
  await bvChoose(my,[{label:'Vorrei prenotare un tavolo',say:'Buonasera, vorrei prenotare un tavolo'},{label:'Avete posto stasera?',say:'Avete posto per stasera?'}]); if(!bvAlive(my))return;
  await bvSay(my,'ai','Volentieri. Per quante persone?',250); if(!bvAlive(my))return;
  var pax=await bvChoose(my,[{label:'Per due',val:2},{label:'Per quattro',val:4}]); if(!bvAlive(my))return; bvBooking.pax=pax.val;
  await bvSay(my,'ai','Perfetto, '+pax.val+'. Per che ora, stasera?',250); if(!bvAlive(my))return;
  var w=await bvChoose(my,[{label:'Alle 20:30',h:20,m:30,say:'Verso le otto e mezza'},{label:'Alle 21:00',h:21,m:0,say:'Alle nove'}]); if(!bvAlive(my))return; bvBooking.h=w.h; bvBooking.m=w.m;
  await bvWait(250); await bvTool(my,'check_availability · '+w.h+':'+(w.m?'30':'00')+' · '+pax.val+'p','disponibile'); if(!bvAlive(my))return;
  await bvSay(my,'ai','Sì, abbiamo posto. A che nome la metto?',200); if(!bvAlive(my))return;
  var who=await bvChoose(my,[{label:'Elena Conti',val:'Elena Conti'},{label:'Marco Belli',val:'Marco Belli'}]); if(!bvAlive(my))return; bvBooking.name=who.val;
  await bvSay(my,'ai','Mi lascia un recapito telefonico, per cortesia?',200); if(!bvAlive(my))return;
  bvBooking.phone=bvPhone(); await bvWait(450); if(!bvAlive(my))return; bvBubble('caller',esc(bvBooking.phone));
  await bvSay(my,'ai','Ripeto: '+esc(bvBooking.phone)+'. Confermo allora?',500); if(!bvAlive(my))return;
  await bvChoose(my,[{label:'Sì, confermo',say:'Sì, perfetto, grazie'}]); if(!bvAlive(my))return;
  await bvWait(200); await bvTool(my,'create_booking','ok=true'); if(!bvAlive(my))return;
  await bvSay(my,'ai','Perfetto! Tavolo per '+bvBooking.pax+', stasera alle '+bvBooking.h+':'+(bvBooking.m?'30':'00')+', a nome '+esc(bvBooking.name)+'. Vi aspettiamo, a presto!',300); if(!bvAlive(my))return;
  if(st)st.textContent='Chiamata terminata · prenotazione creata'; if(orb)orb.classList.remove('live');
  var c=document.getElementById('bvChoices'); if(c)c.innerHTML='<div class="bvc-done">✓ La prenotazione è entrata in agenda, da sola</div><button class="bvbtn" id="bvAgain">↻ Riprova</button>';
  var ag=document.getElementById('bvAgain'); if(ag)ag.addEventListener('click',function(){ var l=document.getElementById('bvLog'); if(l)l.innerHTML=''; var ch=document.getElementById('bvChoices'); if(ch)ch.innerHTML=''; bvBooking={}; bvRun(++bvToken); });
}
})();
</script>
